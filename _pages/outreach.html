<script>
  function resizePdf() {
    const iframe = document.getElementById('pdf-frame');
    if(!iframe) return;

    // Get the distance from the top of the page to the iframe
    const rect = iframe.getBoundingClientRect();
    const topOffset = rect.top + window.scrollY;

    // Set iframe height to fill remaining viewport
    const height = window.innerHeight - topOffset - 20; // 20px padding
    iframe.style.height = height + 'px';
  }

  window.addEventListener('load', resizePdf);
  window.addEventListener('resize', resizePdf);
  window.addEventListener('orientationchange', resizePdf);
</script>
